name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package version v$version" }
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BilyqoPrintAgent-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - name: Publish update files to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $files = Get-ChildItem release -File | Where-Object { $_.Name -match '\.(exe|blockmap)$' -or $_.Name -eq 'latest.yml' } | ForEach-Object { $_.FullName }
          gh release create $env:GITHUB_REF_NAME @files --title "Bilyqo Print Agent $env:GITHUB_REF_NAME" --generate-notes
