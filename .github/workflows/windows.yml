name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BilyqoPrintAgent-Windows
          path: release/*.exe
