name: Windows installer
on:
  workflow_dispatch:
  push:
    tags: ['v*']
jobs:
  build:
    permissions:
      contents: write
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm test
      - name: Verify release tag matches app version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw "Tag must match package version v$version" }
      - run: npm run dist:win -- --publish never
      - uses: actions/upload-artifact@v4
        with:
          name: BilyqoPrintAgent-Windows
          path: |
            release/*.exe
            release/*.blockmap
            release/latest.yml
      - name: Publish update files to GitHub Releases
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: pwsh
        run: |
          $version = node -p "require('./package.json').version"
          $installer = "release/BilyqoPrintAgent-Setup-$version.exe"
          $payloadFiles = @($installer, "$installer.blockmap")
          foreach ($file in @($payloadFiles) + @('release/latest.yml')) {
            if (-not (Test-Path $file -PathType Leaf)) { throw "Missing release file: $file" }
          }
          gh release view $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY
          if ($LASTEXITCODE -ne 0) {
            gh release create $env:GITHUB_REF_NAME --repo $env:GITHUB_REPOSITORY --verify-tag --title "Bilyqo Print Agent $env:GITHUB_REF_NAME" --generate-notes
            if ($LASTEXITCODE -ne 0) { throw 'Could not create GitHub release' }
          }
          gh release upload $env:GITHUB_REF_NAME @payloadFiles --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload installer and blockmap' }
          # Publish the manifest only after its referenced files are available.
          gh release upload $env:GITHUB_REF_NAME release/latest.yml --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Could not upload update manifest' }
